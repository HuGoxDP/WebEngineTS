# player.nginx.conf - the headers the WebEngineTS player must be served with.
#
# Ships in the engine tarball next to player.html and player.js (dist/player/). Copy the three files to a
# directory your server serves under /player/, and `include` this file inside the `server` block. If you serve
# them elsewhere, change the two `location` paths; nothing else here depends on them.
#
# Why each header (measurements: design/player-sandbox.md, sections 5 to 7):
#   - The CSP names the server's own origin (`$scheme://$http_host`), never 'self': WebKit does not match
#     'self' for connect-src inside an opaque-origin document, and the KTX2 transcoder fetch is refused.
#   - `sandbox allow-scripts allow-pointer-lock` in the header keeps player.html opaque when it is opened
#     directly. The host's iframe carries the same tokens as an attribute; each covers the other's absence.
#     `allow-same-origin` must never be added: the scenario would reach the platform's storage and token.
#   - `'unsafe-eval'` is for the Basis transcoder worker (Emscripten glue uses `new Function`).
#   - `Access-Control-Allow-Origin: *` is required: the frame's origin is the string `null`, and a script
#     or module it fetches is cross-origin to the very server that served the frame. It is correct, not
#     sloppy: these are public static files and a header that echoed `null` would be worse.
#   - `add_header` in a `location` REPLACES every header inherited from `server`, so each location below
#     repeats the headers it needs.
#
# Not set here, because they belong to the files you serve besides the player: the engine bundle, the Basis
# transcoder (basis_transcoder.js / .wasm) and any streamed assets and manifest need
# `Access-Control-Allow-Origin: *` too, or the frame cannot load them.

location = /player/player.html {
    add_header Content-Security-Policy "default-src 'none'; script-src $scheme://$http_host blob: 'unsafe-eval'; connect-src $scheme://$http_host blob:; img-src blob:; frame-ancestors 'self'; sandbox allow-scripts allow-pointer-lock" always;
    add_header Access-Control-Allow-Origin "*" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Cache-Control "no-cache" always;
}

location = /player/player.js {
    add_header Access-Control-Allow-Origin "*" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Cache-Control "no-cache" always;
}
