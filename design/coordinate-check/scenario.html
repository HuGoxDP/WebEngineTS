<!DOCTYPE html>
<!--
  Loads one packaged scenario so a rendered frame can be inspected — by a person
  or by scripts/shoot.mjs. Companion to index.html: that one checks the engine's
  own axes, this one checks what the content actually looks like through them.

  Serve from the WORKSPACE ROOT (C:\Users\HuGox\WebstormProjects) so both the
  engine bundle and the release archives are reachable:

    npx http-server . -p 8090 -c-1
    /WebEngineTS/design/coordinate-check/scenario.html?name=DNA

  `name` is the archive stem in ScenarioCreator/ReleaseScenarios.
-->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Scenario viewer</title>
  <style>
    html, body { margin: 0; height: 100%; background: #05070a; overflow: hidden; }
    #view { display: block; width: 100vw; height: 100vh; }
    #tag {
      position: fixed; top: 10px; left: 10px; z-index: 10;
      font: 12px ui-monospace, Consolas, monospace; color: #cfe3ff;
      background: rgba(6, 10, 16, .78); border: 1px solid #22303f;
      border-radius: 6px; padding: 6px 10px; pointer-events: none;
    }
    #err {
      position: fixed; left: 10px; right: 10px; bottom: 10px; z-index: 10;
      font: 12px/1.45 ui-monospace, Consolas, monospace; color: #ff9b9b;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <canvas id="view"></canvas>
  <div id="tag">loading…</div>
  <div id="err"></div>

  <script type="importmap">
    { "imports": { "WebEngineTS": "../../dist/WebEngineTS.standalone.js" } }
  </script>

  <script type="module">
    import { Application } from "WebEngineTS";

    const name = new URLSearchParams(location.search).get("name") ?? "DNA";
    const url = `/ScenarioCreator/ReleaseScenarios/${name}.zip`;
    const tag = document.getElementById("tag");

    try {
      const app = new Application(document.getElementById("view"));
      app.run();

      tag.textContent = `${name} — loading`;
      await app.loadScenarioFromUrl(url);

      // Marks the frame as genuinely rendered, so a screenshot that catches the
      // loading state is distinguishable from one that caught the scene.
      tag.textContent = `${name} — running`;
      window.__scenarioReady = true;
    } catch (e) {
      const msg = e && e.stack ? e.stack : String(e);
      tag.textContent = `${name} — FAILED`;
      document.getElementById("err").textContent = msg;
      window.__scenarioError = msg;
      console.error("[viewer] scenario failed:", msg);
    }
  </script>
</body>
</html>
